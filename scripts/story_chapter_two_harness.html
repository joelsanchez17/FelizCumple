<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Validación privada del capítulo dos</title><link rel="stylesheet" href="../house-story.css">
<style>*{box-sizing:border-box}body{margin:0;padding:18px;color:#5d3b4b;background:#ddebf4;font-family:Arial,sans-serif}#loveHouse{width:min(720px,100%);min-height:620px;margin:auto;padding:18px 0;border-radius:28px;background:#f8eff0;overflow:hidden}.house-entry,.house-room-view{padding:16px}.house-entry[hidden],.house-room-view[hidden]{display:none}.house-map{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.house-map button{min-height:70px;border:1px solid #dbc5ce;border-radius:14px;background:#fff}.house-room-surface{position:relative;height:310px;border-radius:20px;background:linear-gradient(#fff9f5 70%,#d7c4bd 70%);overflow:hidden}.care-object{position:absolute;min-width:90px;min-height:58px;border:1px solid #c9aeb8;border-radius:14px;background:#fff;color:#684456}#housePlant{left:15%;bottom:35px}.house-lamp{right:15%;bottom:35px}#diningTable{left:50%;top:110px;transform:translateX(-50%)}</style></head>
<body><section id="loveHouse"><div id="houseEntrance" class="house-entry"><h1>Nuestra casa</h1><nav class="house-map"><button data-enter-room="bedroom">Dormitorio</button><button data-enter-room="dining">Comedor</button></nav></div>
<div class="house-room-view" data-room-view="bedroom" hidden><button data-enter-room="dining">Ir al comedor</button><div class="house-room-surface"><button id="housePlant" class="care-object" data-room-plant="bedroom">Plantita</button><button class="house-lamp care-object" data-lamp-for="princesa" aria-pressed="false">Lámpara</button></div></div>
<div class="house-room-view" data-room-view="dining" hidden><button data-enter-room="bedroom">Ir al dormitorio</button><div class="house-room-surface"><button id="diningTable" class="care-object" aria-pressed="false">Preparar desayuno</button></div></div></section>
<script>
sessionStorage.setItem('house_story_chapter_one_closed','1');window.loveIdentity='princesa';
const requirements=['care_plant','prepare_breakfast','warm_light'];let storyState={available:true,status:'active',chapter:2,solvedSteps:[],hintsUsed:{},revision:4};
function publish(){window.dispatchEvent(new CustomEvent('housestorychange',{detail:structuredClone(storyState)}));return Promise.resolve(structuredClone(storyState))}
window.HouseStoryEngine={load:()=>publish(),completeStep:step=>{if(!storyState.solvedSteps.includes(step))storyState.solvedSteps.push(step);if(requirements.every(item=>storyState.solvedSteps.includes(item)))storyState.chapter=3;storyState.revision++;return publish()},useHint:level=>{storyState.hintsUsed={'2':level};return publish()}};
const date=new Date(),day=`${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`;
window._loveClient={from:()=>({select:async()=>({data:[{room_id:'bathroom',device_id:'orchid',state:{watered_day:day},updated_by:'joel',updated_at:new Date().toISOString()}],error:null})})};
document.addEventListener('click',event=>{const room=event.target.closest('[data-enter-room]')?.dataset.enterRoom;if(room){houseEntrance.hidden=true;document.querySelectorAll('[data-room-view]').forEach(view=>view.hidden=view.dataset.roomView!==room);return}if(event.target.id==='diningTable'){event.target.setAttribute('aria-pressed','true');setTimeout(()=>window.dispatchEvent(new CustomEvent('lovehousedevicepersisted',{detail:{roomId:'dining',device:'dining_table',state:{set:true},updatedBy:'princesa'}})),20)}if(event.target.matches('[data-lamp-for]')){event.target.setAttribute('aria-pressed','true');setTimeout(()=>window.dispatchEvent(new CustomEvent('lovehousedevicepersisted',{detail:{roomId:'bedroom',device:'lamp_princesa',state:{on:true},updatedBy:'princesa'}})),20)}});
</script><script src="../house-story-chapter-two.js"></script>
<output id="validationResult" hidden>PENDING</output><script>
if(new URLSearchParams(location.search).has('autotest'))(async()=>{const wait=(ms=60)=>new Promise(resolve=>setTimeout(resolve,ms));const click=async selector=>{document.querySelector(selector)?.click();await wait()};try{await wait(180);const previousCare=storyState.solvedSteps.includes('care_plant')&&document.body.textContent.includes('Esta ya está contenta');await click('[data-story-care-hint]');await click('[data-story-care-route="dining"]');await click('#diningTable');await click('[data-story-care-route="bedroom"]');await click('[data-lamp-for]');await wait(80);const checks=[previousCare,storyState.chapter===3,storyState.solvedSteps.length===3,storyState.hintsUsed['2']===1,document.querySelector('.house-story-complete'),document.activeElement?.classList.contains('house-story-complete'),document.documentElement.scrollWidth<=document.documentElement.clientWidth];validationResult.textContent=checks.every(Boolean)?'STORY_CHAPTER_TWO_OK':'STORY_CHAPTER_TWO_FAILED'}catch(error){validationResult.textContent='STORY_CHAPTER_TWO_FAILED: '+error.message}})();
</script></body></html>
