<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Validación privada del capítulo tres</title><link rel="stylesheet" href="../house-story.css"><style>*{box-sizing:border-box}body{margin:0;padding:18px;color:#5d3b4b;background:#ddebf4;font-family:Arial,sans-serif}#loveHouse{width:min(720px,100%);min-height:620px;margin:auto;padding:18px 0;border-radius:28px;background:#f8eff0;overflow:hidden}.house-entry,.house-room-view{padding:16px}.house-entry[hidden],.house-room-view[hidden]{display:none}.house-map{display:grid;grid-template-columns:1fr 1fr;gap:8px}.house-map button,.house-room-view button{min-height:60px;border:1px solid #dbc5ce;border-radius:14px;background:#fff}</style></head><body>
<section id="loveHouse"><div id="houseEntrance" class="house-entry"><h1>Nuestra casa</h1><nav class="house-map"><button data-enter-room="bedroom">Dormitorio</button><button data-enter-room="dining">Comedor</button></nav></div><div class="house-room-view" data-room-view="bedroom" hidden><button data-enter-room="dining">Ir al comedor</button></div><div class="house-room-view" data-room-view="dining" hidden><button data-enter-room="bedroom">Ir al dormitorio</button></div></section>
<script>sessionStorage.setItem('house_story_chapter_two_closed','1');window.loveIdentity='princesa';let storyState={available:true,status:'active',chapter:3,solvedSteps:[],hintsUsed:{},revision:8},cornerState={corner:null,placedItems:[],placements:{}};function publish(){const data={...storyState,storyData:structuredClone(cornerState)};window.dispatchEvent(new CustomEvent('housestorychange',{detail:data}));return Promise.resolve(data)}window.HouseStoryEngine={load:()=>publish(),loadCorner:()=>Promise.resolve(structuredClone(cornerState)),chooseCorner:corner=>{cornerState.corner=corner;return publish()},placeCornerItem:(item,slot)=>{if(!cornerState.placedItems.includes(item))cornerState.placedItems.push(item);cornerState.placements[item]=slot;return publish()},finishCorner:()=>{storyState.chapter=4;return publish()}};document.addEventListener('click',event=>{const room=event.target.closest('[data-enter-room]')?.dataset.enterRoom;if(!room)return;houseEntrance.hidden=true;document.querySelectorAll('[data-room-view]').forEach(view=>view.hidden=view.dataset.roomView!==room)});</script><script src="../house-story-chapter-three.js"></script>
<output id="validationResult" hidden>PENDING</output><script>if(new URLSearchParams(location.search).has('autotest'))(async()=>{const wait=(ms=90)=>new Promise(resolve=>setTimeout(resolve,ms));const click=async selector=>{const target=document.querySelector(selector);if(!target)throw new Error('Falta '+selector);target.click();await wait()};try{await wait(100);await click('[data-story-corner="sofa"]');const firstCard=document.querySelector('[data-story-place-item="blanket"]'),singleChoice=document.querySelectorAll('[data-story-place-item]').length===1&&!document.querySelector('[data-story-slot]');await click('[data-story-place-item="blanket"]');const blanketPlaced=cornerState.placements.blanket==='left'&&document.querySelector('.house-story-image-blanket[data-slot="left"] img');await click('[data-story-place-item="cushion"]');const cushionPlaced=cornerState.placements.cushion==='center'&&document.querySelector('.house-story-image-cushion[data-slot="center"] img');await click('[data-story-place-item="light"]');const lightPlaced=cornerState.placements.light==='right'&&document.querySelector('.house-story-image-light[data-slot="right"] img');const review=document.querySelector('[data-story-view="chapter-three-review"]'),noReposition=!document.querySelector('[data-story-move-item],.house-story-reposition-list'),finishButton=document.querySelector('[data-story-finish-corner]'),finishRect=finishButton?.getBoundingClientRect(),finishVisible=finishRect&&finishRect.top>=0&&finishRect.bottom<=innerHeight,placeholderHidden=getComputedStyle(document.querySelector('.house-story-scene-furniture b')).display==='none';await click('[data-story-finish-corner]');await wait();const checks=[firstCard,singleChoice,blanketPlaced,cushionPlaced,lightPlaced,review,noReposition,finishVisible,placeholderHidden,cornerState.placedItems.length===3,storyState.chapter===4,!document.querySelector('[data-story-view="chapter-three-review"]'),document.documentElement.scrollWidth<=document.documentElement.clientWidth];validationResult.textContent=checks.every(Boolean)?'STORY_CHAPTER_THREE_OK':'STORY_CHAPTER_THREE_FAILED'}catch(error){validationResult.textContent='STORY_CHAPTER_THREE_FAILED: '+error.message}})();</script></body></html>
