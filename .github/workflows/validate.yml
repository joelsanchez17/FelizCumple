name: Validate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: npm ci
      - run: python -m pip install -r requirements-dev.txt
      - name: JavaScript syntax
        run: |
          node --check realtime.js
          node --check together.js
          node --check sw.js
      - name: Python syntax
        run: python -m compileall -q scripts _validate_*.py
      - name: Whitespace and conflict markers
        run: |
          git diff --check
          ! git grep -nE '^(<<<<<<<|=======|>>>>>>>)' -- ':!assets/vendor/supabase.js'
